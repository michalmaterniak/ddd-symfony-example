input {
    beats {
        port => 5044
    }
}

filter {
    # JSON lines (e.g. Monolog JsonFormatter) are expanded into the "app" field
    if [message] =~ /^\s*\{/ {
        json {
            source => "message"
            target => "app"
            skip_on_invalid_json => true
        }
    }

    if [app][message] {
        mutate {
            replace => { "message" => "%{[app][message]}" }
            add_field => { "[log][level]" => "%{[app][level_name]}" }
        }
    }
}

output {
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "docker-logs-%{+YYYY.MM.dd}"
        data_stream => "false"
        template => "/usr/share/logstash/templates/docker-logs.json"
        template_name => "docker-logs"
        template_overwrite => true
    }
}
