monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - http # HttpRequest / HttpResponse / HttpRequestAborted, see App\Shared\Infrastructure\Http\Logging\HttpLoggingListener

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            # JSON on stderr -> docker logs -> filebeat -> Kibana: info and above from every channel (HTTP and workers)
            stderr:
                type: stream
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            # in-memory records for assertions (service "monolog.handler.test")
            test:
                type: test
                level: debug
                channels: [http, app]

when@prod:
    monolog:
        handlers:
            # JSON on stderr -> docker logs -> filebeat -> Kibana: info and above from every channel (HTTP and workers)
            main:
                type: stream
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
